name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Runs all suites except test/e2e.test.js, which needs outbound network
      # access (it scans https://example.com). Run that one locally with
      # `npm run test:e2e`.
      - run: npm test
        env:
          SR_NO_OPEN: "1"
