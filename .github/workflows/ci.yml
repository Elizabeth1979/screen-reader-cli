name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pinned: ubuntu-latest moved to 26.04, where this Playwright cannot
    # install Chromium ("does not support chromium on ubuntu26.04-x64").
    # Back to ubuntu-latest once Playwright is upgraded to a version that does.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Runs all suites except test/e2e.test.js, which needs outbound network
      # access (it scans https://example.com). Run that one locally with
      # `npm run test:e2e`.
      - run: npm test
        env:
          SR_NO_OPEN: "1"
