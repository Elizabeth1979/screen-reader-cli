<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Header inside an article</title>
</head>
<body>
  <header>Site header</header>
  <main>
    <h1>Articles</h1>
    <article>
      <header><h2>Card title</h2></header>
      <p>Card body</p>
    </article>
  </main>
</body>
</html>
